services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: migration
      POSTGRES_USER: migration
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - raijin-postgres:/var/lib/postgresql/data
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d migration"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment: &raijin-environment
      RAIJIN_OPERATION_MODE: REAL
      DATABASE_URL: postgresql+psycopg://migration@postgres:5432/migration
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      RAIJIN_WEB_BIND_HOST: ${RAIJIN_WEB_BIND_HOST:-127.0.0.1}
      RAIJIN_WEB_AUTH_MODE: ${RAIJIN_WEB_AUTH_MODE:-disabled}
    ports:
      - "${RAIJIN_WEB_BIND_HOST:-127.0.0.1}:${RAIJIN_WEB_BIND_PORT:-1604}:8080"
    secrets: [postgres_password]

  raikou-shin: &worker
    build: .
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *raijin-environment
      RAIJIN_WORKER_ROLE: raikou-shin
      RAIJIN_WORKER_ID: raikou-shin-compose
    command: ["python3", "-m", "app.controller_worker"]
    secrets: [postgres_password]

  raikou-sei:
    <<: *worker
    environment:
      <<: *raijin-environment
      RAIJIN_WORKER_ROLE: raikou-sei
      RAIJIN_WORKER_ID: raikou-sei-compose
    command: ["python3", "-m", "app.restore_worker"]

  raikou-ko:
    <<: *worker
    environment:
      <<: *raijin-environment
      RAIJIN_WORKER_ROLE: raikou-ko
      RAIJIN_WORKER_ID: raikou-ko-compose
    command: ["python3", "-m", "app.discovery_worker"]

  raikou-kai:
    <<: *worker
    environment:
      <<: *raijin-environment
      RAIJIN_WORKER_ROLE: raikou-kai
      RAIJIN_WORKER_ID: raikou-kai-compose
    command: ["python3", "-m", "app.audit_worker"]

  raiju:
    <<: *worker
    environment:
      <<: *raijin-environment
      RAIJIN_WORKER_ROLE: raiju
      RAIJIN_WORKER_ID: raiju-compose
    command: ["python3", "-m", "app.transfer_worker"]

secrets:
  postgres_password:
    file: ${RAIJIN_POSTGRES_PASSWORD_FILE:?set RAIJIN_POSTGRES_PASSWORD_FILE}

volumes:
  raijin-postgres:
