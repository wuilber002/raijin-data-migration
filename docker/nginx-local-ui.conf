server {
  listen 8080;
  # The Fujin container can receive a new address after a restart. Resolve the
  # private alias dynamically instead of retaining that former address in the
  # gateway process.
  resolver __FUJIN_DNS_RESOLVER__ valid=10s ipv6=off;
  set $fujin_local_upstream fujin-local;
  set $raijin_local_upstream local-app;
  # Raijin's existing SPA intentionally uses absolute /api and /static URLs.
  # Keep those requests on the same local-only gateway while presenting the
  # UI itself under /raijin/ as the LOCAL topology contract requires.
  location = / { return 302 /raijin/; }
  location /raijin/ {
    # A variable forces periodic resolver use, so replacing the API container
    # cannot leave Nginx pinned to its former Podman address.
    rewrite ^/raijin/(.*)$ /$1 break;
    proxy_pass http://$raijin_local_upstream:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /raijin;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /api/ {
    proxy_pass http://$raijin_local_upstream:8080;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /static/ {
    proxy_pass http://$raijin_local_upstream:8080;
    proxy_set_header Host $host;
  }
  location /healthz {
    proxy_pass http://$raijin_local_upstream:8080;
    proxy_set_header Host $host;
  }
  location = /fujin { return 301 /fujin/; }
  location /fujin/api/ {
    # A variable upstream disables Nginx's normal prefix replacement. Rewrite
    # explicitly so `/fujin/api/local/...` remains Fujin's `/api/local/...`.
    rewrite ^/fujin/api/(.*)$ /api/$1 break;
    proxy_pass https://$fujin_local_upstream:443;
    proxy_set_header Host $host;
    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_ssl_name fujin-local;
  }
  location /fujin/static/ {
    rewrite ^/fujin/static/(.*)$ /static/$1 break;
    proxy_pass https://$fujin_local_upstream:443;
    proxy_set_header Host $host;
    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_ssl_name fujin-local;
  }
  location /fujin/ {
    proxy_pass https://$fujin_local_upstream:443/console;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /fujin;
    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_ssl_name fujin-local;
  }
}
